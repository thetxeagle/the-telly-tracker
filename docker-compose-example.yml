services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telly_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-telly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-telly-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telly} -d ${POSTGRES_DB:-telly_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - telly-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tellytracker

  app:
    image: ${APP_IMAGE:-ghcr.io/thetxeagle/the-telly-tracker:v0.1.0}
    ports:
      - "${WEB_PORT:-8080}:3001"
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-telly}:${POSTGRES_PASSWORD:-local-telly-password}@database:5432/${POSTGRES_DB:-telly_tracker}?schema=public&connection_limit=${DATABASE_CONNECTION_LIMIT:-5}&pool_timeout=${DATABASE_POOL_TIMEOUT_SECONDS:-10}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - tellytracker

volumes:
  telly-data:

networks:
  tellytracker:
    driver: bridge
