name: Publish Application Container

on:
  push:
    branches:
      - main
      - "v*"
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-container.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "server/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="${REGISTRY}/${IMAGE_REPO}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${IMAGE}:latest\n${IMAGE}:sha-${SHORT_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME}\n${IMAGE}:sha-${SHORT_SHA}"
          elif [[ "${GITHUB_REF}" == refs/heads/v* ]]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME}\n${IMAGE}:sha-${SHORT_SHA}"
          else
            TAGS="${IMAGE}:sha-${SHORT_SHA}"
          fi

          {
            echo "tags<<EOF"
            printf "%b\n" "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
